- name: Ensure base packages are installed
  ansible.builtin.apt:
    name:
      - build-essential
      - bubblewrap
      - fuse3
      - gh
      - git
      - iproute2
      - npm
      - python-is-python3
      - ripgrep
      - rustup
      - xz-utils
      - zstd
      - zsh
    state: present
    update_cache: true

- name: Check which slow Armbian motd scripts exist
  ansible.builtin.stat:
    path: "/etc/update-motd.d/{{ item }}"
  loop:
    - 10-armbian-header
    - 15-ap-info
    - 20-ip-info
    - 30-armbian-sysinfo
    - 35-armbian-tips
    - 41-commands
  register: opencode_motd_scripts_stat

- name: Disable slow Armbian motd scripts to reduce SSH login overhead
  ansible.builtin.file:
    path: "/etc/update-motd.d/{{ item.item }}"
    mode: "a-x"
  loop: "{{ opencode_motd_scripts_stat.results }}"
  when: item.stat.exists

- name: Ensure Node.js installation directory exists
  ansible.builtin.file:
    path: /opt
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check whether Node.js {{ opencode_node_version }} is already installed
  ansible.builtin.stat:
    path: "{{ opencode_node_install_dir }}/bin/node"
  register: opencode_node_installed

- name: Download Node.js {{ opencode_node_version }} archive
  ansible.builtin.get_url:
    url: "{{ opencode_node_archive_url }}"
    dest: "{{ opencode_node_archive }}"
    owner: root
    group: root
    mode: "0644"
  when: not opencode_node_installed.stat.exists

- name: Extract Node.js {{ opencode_node_version }}
  ansible.builtin.unarchive:
    src: "{{ opencode_node_archive }}"
    dest: /opt
    remote_src: true
    creates: "{{ opencode_node_install_dir }}/bin/node"

- name: Link selected Node.js executables
  ansible.builtin.file:
    src: "{{ opencode_node_bin_dir }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    owner: root
    group: root
  loop:
    - node
    - npm
    - npx

- name: Check whether Neovim is already installed
  ansible.builtin.stat:
    path: "{{ opencode_nvim_bin }}"
  register: opencode_nvim_installed

- name: Download Neovim ARM64 archive
  ansible.builtin.get_url:
    url: "{{ opencode_nvim_archive_url }}"
    dest: "{{ opencode_nvim_archive }}"
    owner: root
    group: root
    mode: "0644"
  when: not opencode_nvim_installed.stat.exists

- name: Extract Neovim ARM64
  ansible.builtin.unarchive:
    src: "{{ opencode_nvim_archive }}"
    dest: /opt
    remote_src: true
    creates: "{{ opencode_nvim_bin }}"

- name: Link Neovim executable
  ansible.builtin.file:
    src: "{{ opencode_nvim_bin }}"
    dest: /usr/local/bin/nvim
    state: link
    owner: root
    group: root

- name: Determine global npm prefix
  ansible.builtin.command:
    argv:
      - npm
      - prefix
      - -g
  environment:
    PATH: "{{ opencode_node_bin_dir }}:{{ ansible_env.PATH }}"
  register: npm_prefix
  changed_when: false

- name: Check whether kimi code is already installed globally
  ansible.builtin.command:
    argv:
      - npm
      - list
      - -g
      - "@moonshot-ai/kimi-code"
      - --depth=0
  environment:
    PATH: "{{ opencode_node_bin_dir }}:{{ ansible_env.PATH }}"
  register: kimi_npm_list
  changed_when: false
  failed_when: false
  when: opencode_enable_kimi
  tags: [kimi]

- name: Parse installed kimi code version from npm list output
  ansible.builtin.set_fact:
    kimi_installed_version: "{{ kimi_npm_list.stdout | regex_search('@moonshot-ai/kimi-code@[0-9]+\\.[0-9]+\\.[0-9]+') | default('', true) | regex_replace('^@moonshot-ai/kimi-code@', '') }}"
  when: opencode_enable_kimi and kimi_npm_list.rc == 0
  tags: [kimi]

- name: Decide whether kimi code upgrade is needed
  ansible.builtin.set_fact:
    kimi_upgrade_needed: "{{ (kimi_npm_list.rc != 0) or (kimi_installed_version is version(kimi_minimum_version, '<')) }}"
  when: opencode_enable_kimi
  tags: [kimi]

- name: Install or upgrade kimi code globally when below minimum version
  ansible.builtin.command:
    argv:
      - npm
      - install
      - -g
      - "@moonshot-ai/kimi-code"
  environment:
    PATH: "{{ opencode_node_bin_dir }}:{{ ansible_env.PATH }}"
  when: opencode_enable_kimi and kimi_upgrade_needed
  notify: Restart kimi
  tags: [kimi]

- name: Check whether pnpm {{ opencode_pnpm_version }} is already installed
  ansible.builtin.command:
    argv:
      - pnpm
      - --version
  environment:
    PATH: "{{ opencode_node_bin_dir }}:{{ ansible_env.PATH }}"
  register: pnpm_version_check
  changed_when: false
  failed_when: false
  when: deepseek_harness_enabled

- name: Install pnpm {{ opencode_pnpm_version }} when missing or wrong major
  ansible.builtin.command:
    argv:
      - npm
      - install
      - -g
      - "pnpm@{{ opencode_pnpm_version }}"
  environment:
    PATH: "{{ opencode_node_bin_dir }}:{{ ansible_env.PATH }}"
  when: >
    deepseek_harness_enabled and (
      pnpm_version_check.rc != 0
      or (pnpm_version_check.stdout | trim | split('.') | first) != (opencode_pnpm_version | split('.') | first)
    )

- name: Determine installed pnpm path
  ansible.builtin.shell: command -v pnpm
  environment:
    PATH: "{{ opencode_node_bin_dir }}:{{ ansible_env.PATH }}"
  register: pnpm_path
  changed_when: false
  when: deepseek_harness_enabled

- name: Ensure DeepSeek harness directory exists
  ansible.builtin.file:
    path: "{{ deepseek_harness_dir }}"
    state: directory
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    mode: "0750"
  when: deepseek_harness_enabled

- name: Check whether DeepSeek harness package is already installed
  ansible.builtin.stat:
    path: "{{ deepseek_harness_dir }}/node_modules/{{ deepseek_harness_package }}"
  register: deepseek_harness_installed
  when: deepseek_harness_enabled

- name: Install DeepSeek harness with pnpm
  ansible.builtin.command:
    argv:
      - pnpm
      - add
      - --dir
      - "{{ deepseek_harness_dir }}"
      - --save-exact
      - "{{ deepseek_harness_package }}"
  become: true
  become_user: "{{ opencode_user }}"
  environment:
    HOME: "{{ opencode_home }}"
  when: deepseek_harness_enabled and not deepseek_harness_installed.stat.exists
  register: deepseek_harness_install
  notify: Restart deepseek harness

- name: Ensure DeepSeek plugins source parent directory exists
  ansible.builtin.file:
    path: "{{ deepseek_harness_plugins_repo_dir | dirname }}"
    state: directory
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    mode: "0750"
  when: deepseek_harness_enabled

- name: Check whether DeepSeek plugins repository exists
  ansible.builtin.stat:
    path: "{{ deepseek_harness_plugins_repo_dir }}/.git"
  register: deepseek_harness_plugins_repo_git_dir
  when: deepseek_harness_enabled

- name: Read existing DeepSeek plugins repository origin URL
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ deepseek_harness_plugins_repo_dir }}"
      - config
      - --get
      - remote.origin.url
  register: deepseek_harness_plugins_repo_origin_url
  changed_when: false
  failed_when: false
  when: deepseek_harness_enabled and deepseek_harness_plugins_repo_git_dir.stat.exists

- name: Clone or update DeepSeek plugins repository
  ansible.builtin.git:
    repo: >-
      {{ deepseek_harness_plugins_repo_origin_url.stdout
         if (
           deepseek_harness_plugins_repo_git_dir.stat.exists
           and deepseek_harness_plugins_repo_origin_url.stdout is defined
           and (
             deepseek_harness_plugins_repo_origin_url.stdout.startswith('git@')
             or deepseek_harness_plugins_repo_origin_url.stdout.startswith('ssh://')
           )
         )
         else deepseek_harness_plugins_repo }}
    dest: "{{ deepseek_harness_plugins_repo_dir }}"
    version: HEAD
    update: true
  become: true
  become_user: "{{ opencode_user }}"
  when: deepseek_harness_enabled

- name: Check whether configured DeepSeek harness plugins are present
  ansible.builtin.command:
    argv:
      - /usr/local/bin/node
      - -e
      - >-
        const fs = require('fs');
        const packageJson = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
        const plugin = process.argv[2];
        process.exit(
          packageJson.dependencies?.[plugin]
          || packageJson.devDependencies?.[plugin]
          || packageJson.optionalDependencies?.[plugin]
          ? 0 : 1
        );
      - "{{ deepseek_harness_profiles_dir }}/{{ item.profile }}/package.json"
      - "{{ item.package }}"
  become: true
  become_user: "{{ opencode_user }}"
  environment:
    HOME: "{{ opencode_home }}"
  loop: "{{ deepseek_harness_plugins }}"
  register: deepseek_harness_plugin_checks
  changed_when: false
  failed_when: false
  when: deepseek_harness_enabled and (deepseek_harness_plugins | length > 0)

- name: Install missing DeepSeek harness plugins
  ansible.builtin.command:
    argv:
      - /usr/local/bin/pnpm
      - --dir
      - "{{ deepseek_harness_dir }}"
      - exec
      - dsh
      - plugin
      - --profile
      - "{{ item.item.profile }}"
      - add
      - -w
      - "{{ item.item.source | default(item.item.package) }}"
  become: true
  become_user: "{{ opencode_user }}"
  environment:
    HOME: "{{ opencode_home }}"
  loop: "{{ deepseek_harness_plugin_checks.results | default([]) }}"
  when: deepseek_harness_enabled and item.rc != 0
  register: deepseek_harness_plugin_install
  notify: Restart deepseek harness

- name: Remove stale DeepSeek harness patch marker after pnpm installation
  ansible.builtin.file:
    path: "{{ deepseek_harness_patch_marker }}"
    state: absent
  when: >-
    deepseek_harness_enabled and (deepseek_harness_install.changed | default(false))

- name: Check whether the DeepSeek harness source patch is already applied
  ansible.builtin.stat:
    path: "{{ deepseek_harness_patch_marker }}"
  register: deepseek_harness_patch_marker_stat
  when: deepseek_harness_enabled

- name: Locate DeepSeek harness loopback hostname implementations
  ansible.builtin.find:
    paths: "{{ deepseek_harness_pnpm_store_dir }}"
    patterns:
      - index.js
      - client.js
    contains: 'function isLoopbackHostname\(hostname\) \{'
    read_whole_file: true
    recurse: true
    file_type: file
  register: deepseek_harness_patch_files
  when: deepseek_harness_enabled and not deepseek_harness_patch_marker_stat.stat.exists

- name: Force DeepSeek harness loopback hostname checks to succeed
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '(?ms)^([ \t]*)function isLoopbackHostname\(hostname\) \{\n.*?^\1\}'
    replace: '\1function isLoopbackHostname(hostname) {\n\1\treturn true;\n\1}'
    backup: false
  loop: "{{ deepseek_harness_patch_files.files | default([]) }}"
  when: deepseek_harness_enabled and not deepseek_harness_patch_marker_stat.stat.exists

- name: Mark the DeepSeek harness source patch as applied
  ansible.builtin.file:
    path: "{{ deepseek_harness_patch_marker }}"
    state: touch
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    mode: "0644"
  when: deepseek_harness_enabled and not deepseek_harness_patch_marker_stat.stat.exists

- name: Check whether the opencode binary exists
  ansible.builtin.stat:
    path: "{{ opencode_bin }}"
  register: opencode_bin_stat

- name: Show opencode deploy hint when binary is missing
  ansible.builtin.debug:
    msg: >-
      {{ opencode_bin }} does not exist. Deploy it from {{ opencode_repo }}:
      git clone {{ opencode_repo }} && cd opencode && make clean deploy
  when: not opencode_bin_stat.stat.exists

- name: Ensure opencode group exists
  ansible.builtin.group:
    name: "{{ opencode_group }}"
    system: true

- name: Ensure opencode user exists
  ansible.builtin.user:
    name: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    system: true
    create_home: true
    home: "{{ opencode_home }}"
    shell: /bin/zsh

- name: Enable linger for opencode user
  ansible.builtin.command:
    argv:
      - loginctl
      - enable-linger
      - "{{ opencode_user }}"
    creates: /var/lib/systemd/linger/{{ opencode_user }}

- name: Read opencode passwd entry
  ansible.builtin.getent:
    database: passwd
    key: "{{ opencode_user }}"

- name: Set opencode uid fact
  ansible.builtin.set_fact:
    opencode_user_uid: "{{ ansible_facts.getent_passwd[opencode_user][1] }}"

- name: Ensure opencode home exists
  ansible.builtin.file:
    path: "{{ opencode_home }}"
    state: directory
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    mode: "0750"

- name: Ensure opencode local bin directory exists
  ansible.builtin.file:
    path: "{{ opencode_home }}/.local/bin"
    state: directory
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    mode: "0750"

- name: Install DeepSeek harness wrapper
  ansible.builtin.copy:
    dest: "{{ deepseek_harness_wrapper }}"
    content: |-
      #!/bin/sh
      exec /usr/local/bin/pnpm --dir /home/opencode/.deepseek-harness exec dsh "$@"
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    mode: "0750"
  when: deepseek_harness_enabled

- name: Check whether Codex binary is already installed
  ansible.builtin.stat:
    path: "{{ opencode_codex_bin }}"
  register: opencode_codex_bin_stat

- name: Download Codex release
  ansible.builtin.get_url:
    url: "{{ opencode_codex_download_url }}"
    dest: "{{ opencode_codex_archive }}"
    owner: root
    group: root
    mode: "0644"
  when: not opencode_codex_bin_stat.stat.exists

- name: Extract Codex into opencode local bin
  ansible.builtin.command:
    argv:
      - zstd
      - --decompress
      - --force
      - "{{ opencode_codex_archive }}"
      - -o
      - "{{ opencode_codex_bin }}"
    creates: "{{ opencode_codex_bin }}"
  become: true

- name: Set Codex binary ownership and permissions
  ansible.builtin.file:
    dest: "{{ opencode_codex_bin }}"
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    mode: "0755"

- name: Ensure opencode src directory exists
  ansible.builtin.file:
    path: "{{ opencode_src_dir }}"
    state: directory
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    mode: "0750"

- name: Ensure opencode .config directory exists
  ansible.builtin.file:
    path: "{{ opencode_home }}/.config"
    state: directory
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    mode: "0750"

- name: Check whether opencode dotfiles repo exists
  ansible.builtin.stat:
    path: "{{ item.dest }}/.git"
  loop: "{{ opencode_repositories }}"
  register: opencode_repository_git_dirs

- name: Clone opencode repositories
  ansible.builtin.git:
    repo: "{{ item.item.repo }}"
    dest: "{{ item.item.dest }}"
    version: HEAD
    update: false
  become: true
  become_user: "{{ opencode_user }}"
  loop: "{{ opencode_repository_git_dirs.results }}"
  when: not item.stat.exists

- name: Check whether stable rust toolchain is installed
  ansible.builtin.command:
    argv:
      - "{{ opencode_rustup_bin }}"
      - run
      - "{{ opencode_rustup_toolchain }}"
      - rustc
      - --version
  register: opencode_rustup_toolchain_check
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ opencode_user }}"
  environment:
    HOME: "{{ opencode_home }}"

- name: Install stable rust toolchain without docs
  ansible.builtin.command:
    argv:
      - "{{ opencode_rustup_bin }}"
      - toolchain
      - install
      - "{{ opencode_rustup_toolchain }}"
      - --profile
      - "{{ opencode_rustup_profile }}"
  become: true
  become_user: "{{ opencode_user }}"
  environment:
    HOME: "{{ opencode_home }}"
  when: opencode_rustup_toolchain_check.rc != 0

- name: Check whether leash is installed
  ansible.builtin.stat:
    path: "{{ opencode_home }}/.cargo/bin/leash"
  register: opencode_leash_bin_stat

- name: Install leash from source
  ansible.builtin.command:
    argv:
      - "{{ opencode_rustup_bin }}"
      - run
      - "{{ opencode_rustup_toolchain }}"
      - cargo
      - install
      - --path
      - .
  args:
    chdir: "{{ opencode_leash_dir }}"
  become: true
  become_user: "{{ opencode_user }}"
  environment:
    HOME: "{{ opencode_home }}"
  when: not opencode_leash_bin_stat.stat.exists

- name: Link opencode gitconfig
  ansible.builtin.file:
    src: "{{ opencode_dotfiles_dir }}/.gitconfig"
    dest: "{{ opencode_home }}/.gitconfig"
    state: link
    force: true
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"

- name: Link opencode zshrc
  ansible.builtin.file:
    src: "{{ opencode_dotfiles_dir }}/.zshrc"
    dest: "{{ opencode_home }}/.zshrc"
    state: link
    force: true
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"

- name: Link opencode zsh config
  ansible.builtin.file:
    src: "../src/dotfiles/.config/zsh"
    dest: "{{ opencode_home }}/.config/zsh"
    state: link
    force: true
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"

- name: Link opencode git hooks
  ansible.builtin.file:
    src: "{{ opencode_dotfiles_dir }}/.config/git-hooks"
    dest: "{{ opencode_home }}/.config/git-hooks"
    state: link
    force: true
    follow: false
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"

- name: Ensure kimi code config directory exists
  ansible.builtin.file:
    path: "{{ opencode_home }}/.kimi-code"
    state: directory
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    mode: "0700"
  when: opencode_enable_kimi
  tags: [kimi]
- name: Install kimi code dotfiles links
  ansible.builtin.include_role:
    name: dotfiles
    tasks_from: kimi_code_agents
  vars:
    dotfiles_agents_source: "{{ opencode_dotfiles_dir }}/.config/opencode/AGENTS.md"
    dotfiles_kimi_code_config_dir: "{{ opencode_home }}/.kimi-code"
    dotfiles_kimi_code_link_owner: "{{ opencode_user }}"
    dotfiles_kimi_code_link_group: "{{ opencode_group }}"
  when: opencode_enable_kimi
  tags: [kimi]
- name: Ensure opencode config directory exists
  ansible.builtin.file:
    path: "{{ opencode_home }}/.config/opencode"
    state: directory
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    mode: "0750"

- name: Link opencode AGENTS.md
  ansible.builtin.file:
    src: "../../src/dotfiles/.config/opencode/AGENTS.md"
    dest: "{{ opencode_home }}/.config/opencode/AGENTS.md"
    state: link
    force: true
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"

- name: Link opencode opencode.json
  ansible.builtin.file:
    src: "../../src/dotfiles/.config/opencode/opencode.json"
    dest: "{{ opencode_home }}/.config/opencode/opencode.json"
    state: link
    force: true
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"

- name: Link opencode plugins
  ansible.builtin.file:
    src: "../../src/dotfiles/.config/opencode/plugins"
    dest: "{{ opencode_home }}/.config/opencode/plugins"
    state: link
    force: true
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"

- name: Write opencode local git config
  ansible.builtin.copy:
    dest: "{{ opencode_home }}/.gitconfig.local"
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    mode: "0640"
    content: |
      [user]
              name = Jun Wu
              email = quark@lihdd.net

- name: Ensure opencode config directory exists
  ansible.builtin.file:
    path: "{{ opencode_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Locate opencode vault variables file
  ansible.builtin.set_fact:
    opencode_vault_file: >-
      {{ lookup(
        'ansible.builtin.first_found',
        {
          'files': (
            [inventory_hostname ~ '/vault.yml']
            + (
              group_names
              | map('regex_replace', '$', '/vault.yml')
              | list
            )
          ),
          'paths': [
            inventory_dir ~ '/group_vars',
            playbook_dir ~ '/../group_vars'
          ]
        },
        errors='ignore'
      ) }}

- name: Load opencode vault variables
  ansible.builtin.include_vars:
    file: "{{ opencode_vault_file }}"
  when: opencode_vault_file | default('', true) | length > 0

- name: Warn when opencode server password is not set
  ansible.builtin.debug:
    msg: >-
      opencode_server_password is not set; skipping the environment file update
      so any existing OPENCODE_SERVER_PASSWORD on the host is kept. Define it in
      an ansible-vault file (inventory/group_vars/opi_nodes/vault.yml) and
      re-run the playbook.
  when: opencode_server_password is not defined or opencode_server_password | length == 0

- name: Write opencode environment file
  ansible.builtin.copy:
    dest: "{{ opencode_env_file }}"
    owner: root
    group: root
    mode: "0600"
    content: |
      OPENCODE_SERVER_PASSWORD={{ opencode_server_password | to_json }}
      OPENCODE_ENABLE_EXA=1
      # Prefer the persistent server token at ~/.kimi-code/server.token; it does not expire server-side.
      KIMI_CODE_ALLOWED_HOSTS={{ kimi_code_allowed_hosts | to_json }}
      KIMI_DISABLE_TELEMETRY=1
  when: opencode_server_password is defined and opencode_server_password | length > 0
  no_log: true
  notify:
    - Restart opencode
    - Restart kimi

- name: Determine primary IPv4 address
  ansible.builtin.command:
    argv:
      - ip
      - -j
      - -4
      - route
      - get
      - 1.1.1.1
  register: opencode_primary_ipv4_route
  changed_when: false

- name: Parse primary IPv4 address
  ansible.builtin.set_fact:
    opencode_primary_ipv4_addresses: >-
      {{
        opencode_primary_ipv4_route.stdout
        | from_json
        | map(attribute='prefsrc', default='')
        | select('match', '^[0-9]+(?:[.][0-9]+){3}$')
        | list
      }}

- name: Require one primary IPv4 address
  ansible.builtin.assert:
    that:
      - opencode_primary_ipv4_addresses | length == 1
    fail_msg: >-
      Could not determine one primary IPv4 address from
      "ip -j -4 route get 1.1.1.1": {{ opencode_primary_ipv4_route.stdout }}

- name: Parse primary IPv4 octets
  ansible.builtin.set_fact:
    opencode_primary_ipv4_octets: "{{ opencode_primary_ipv4_addresses[0].split('.') }}"

- name: Require room for sibling proxy subnet
  ansible.builtin.assert:
    that:
      - opencode_primary_ipv4_octets[2] | int < 255
    fail_msg: >-
      Cannot derive the sibling proxy address from {{ opencode_primary_ipv4_addresses[0] }}:
      its third octet cannot be incremented.

- name: Derive sibling proxy address
  ansible.builtin.set_fact:
    opencode_sibling_proxy_address: >-
      {{
        opencode_primary_ipv4_octets[0]
        ~ '.' ~ opencode_primary_ipv4_octets[1]
        ~ '.' ~ ((opencode_primary_ipv4_octets[2] | int) + 1)
        ~ '.1'
      }}

- name: Install opencode systemd unit
  ansible.builtin.template:
    src: opencode.service.j2
    dest: /etc/systemd/system/{{ opencode_service_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart opencode

- name: Ensure opencode service is enabled and started
  ansible.builtin.systemd:
    name: "{{ opencode_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Install kimi systemd unit
  ansible.builtin.template:
    src: kimi.service.j2
    dest: /etc/systemd/system/{{ kimi_service_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart kimi
  when: opencode_enable_kimi
  tags: [kimi]
- name: Ensure kimi service is enabled and started
  ansible.builtin.systemd:
    name: "{{ kimi_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  when: opencode_enable_kimi
  tags: [kimi]

- name: Stop and disable Kimi service if disabled
  ansible.builtin.systemd:
    name: "{{ kimi_service_name }}"
    enabled: false
    state: stopped
  when: not opencode_enable_kimi
  failed_when: false
  tags: [kimi]

- name: Remove Kimi systemd unit if disabled
  ansible.builtin.file:
    path: /etc/systemd/system/{{ kimi_service_name }}.service
    state: absent
  when: not opencode_enable_kimi
  notify: Reload systemd
  tags: [kimi]

