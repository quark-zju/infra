- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart opencode
  ansible.builtin.systemd:
    name: "{{ opencode_service_name }}"
    state: restarted

- name: Restart kimi
  ansible.builtin.systemd:
    name: "{{ kimi_service_name }}"
    state: restarted

- name: Restart deepseek harness
  ansible.builtin.systemd:
    name: "{{ deepseek_harness_service_name }}"
    state: restarted

# Restarting the socket unit stops and re-arms socket activation, which also
# restarts the socket-activated proxyd service (it is re-launched on the next
# incoming connection).
- name: Restart deepseek harness proxy
  ansible.builtin.systemd:
    name: "{{ deepseek_harness_proxy_service_name }}.socket"
    state: restarted
